<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">

<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&family=Saira:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ROTA 45 — client trip page (same tokens as the main site)
   ============================================================ */
:root{
  --red:#FF0019;
  --red-dk:#C4000F;
  --ink:#0B0B0C;
  --ink-2:#17171A;
  --grey-1:#6B6B75;
  --grey-2:#9A9AA4;
  --line:#E4E4EA;
  --paper:#FFFFFF;
  --paper-2:#F5F5F7;

  --display:'Exo 2','Arial Narrow',Impact,sans-serif;
  --body:'Saira','Helvetica Neue',Arial,sans-serif;
  --mono:'Roboto Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.16,.84,.28,1);
  --shadow-lg:0 2px 4px rgba(11,11,12,.05),0 24px 56px -24px rgba(11,11,12,.26);
  --cut:22px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
h1,h2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;line-height:1.05;margin:0}
p{margin:0}
[hidden]{display:none !important}
.cut{clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.block .live-map{aspect-ratio:4/3}
.label{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--grey-1)}
.slash{display:inline-block;width:28px;height:3px;background:var(--red);transform:skewX(-24deg)}

.top{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px}
.top img{height:34px;width:auto}
.top a.tel{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em;text-decoration:none}
/* devices in dark mode darken the page themselves: dark bar + white logo */
@media (prefers-color-scheme: dark){
  .topbar{background:var(--ink)}
  .top a.tel{color:#fff}
}
.checker{
  height:6px;opacity:.12;
  background-image:conic-gradient(var(--ink) 90deg,transparent 90deg 180deg,var(--ink) 180deg 270deg,transparent 270deg);
  background-size:12px 12px;
}

.wrap{max-width:760px;margin:0 auto;padding:32px 16px 56px;display:grid;gap:32px}
.kicker{display:flex;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:clamp(36px,9vw,56px)}
.route{margin-top:10px;font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(20px,4.6vw,28px);line-height:1.15}
.route i{font-style:normal;color:var(--red);padding:0 8px}

/* ---------- status steps ---------- */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:28px;padding:0 6px}
.step{padding:12px 10px;background:var(--paper-2);transform:skewX(-12deg)}
.step span{
  display:flex;align-items:center;justify-content:center;gap:8px;transform:skewX(12deg);text-align:center;
  font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(12px,3.4vw,16px);
  color:var(--grey-2);line-height:1.1;
}
.step.done{background:var(--ink)}
.step.done span{color:#fff}
.step.now{background:var(--red)}
.step.now span{color:#fff}
.step.now.moving span::before{
  content:"";width:8px;height:8px;border-radius:50%;background:#fff;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse-w 2s infinite;
}
@keyframes pulse-w{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.status{margin-top:18px;font-size:19px;font-weight:500}
.status b{color:var(--red-dk)}

/* ---------- arrival estimate, styled like a timing screen ---------- */
.eta{
  margin-top:22px;display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:1px;
  background:rgba(255,255,255,.12);border-left:4px solid var(--red);
}
.eta>div{background:var(--ink);color:#fff;padding:14px 16px;display:grid;gap:6px;align-content:start}
.eta .label{color:var(--grey-2)}
.eta b{
  font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;
  font-size:clamp(18px,4.4vw,26px);line-height:1.05;
}
.eta-main b{color:#fff}
.eta-off{margin-top:22px;padding:14px 16px;background:var(--paper-2);border-left:4px solid var(--line);display:grid;gap:4px}
.eta-note{margin-top:8px;font-size:13.5px;color:var(--grey-1)}
@media (max-width:520px){
  .eta{grid-template-columns:1fr 1fr}
  .eta-main{grid-column:1 / -1}
}

/* ---------- blocks ---------- */
.block{display:grid;gap:14px}
.block h2{font-size:22px}
.vols{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.vols li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.vols span{color:var(--grey-1);font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--grey-1)}

.contact{background:var(--ink);color:#fff;padding:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.contact p{font-size:17px}
.contact b{display:block;font-family:var(--mono);font-size:20px;letter-spacing:.02em;user-select:all}
.btn{
  display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-style:italic;
  text-transform:uppercase;letter-spacing:.03em;font-size:16px;line-height:1;padding:14px 22px;border:0;border-radius:2px;
  background:var(--red);color:#fff;text-decoration:none;white-space:nowrap;
}
.btn:hover{background:var(--red-dk)}

.demo{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:#fff;background:var(--ink);padding:3px 8px;transform:skewX(-10deg);
}
.missing{padding:24px;background:var(--paper-2);display:grid;gap:10px}
.foot{max-width:760px;margin:0 auto;padding:0 16px 32px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey-2)}

@media (prefers-reduced-motion:reduce){ .step.now.moving span::before{animation:none} }
</style>
</head>

<body>
<div class="topbar">
<header class="top">
  <a href="./" aria-label="Rota 45 Transportes"><picture>
    <source srcset="assets/logo-white.png" media="(prefers-color-scheme: dark)">
    <img src="assets/logo.png" alt="Rota 45 Transportes">
  </picture></a>
  <a class="tel" href="tel:+351967951060">+351 967 951 060</a>
</header>
</div>
<div class="checker"></div>

<main class="wrap">
  <section id="head"></section>

  <section class="block" id="mapBlock" hidden>
    <div class="kicker"><span class="slash"></span><span class="label">Onde está a carrinha</span></div>
    <aside class="live-map cut" aria-label="Posição da carrinha no mapa">
      <div class="lm-fallback" aria-hidden="true"></div>
      <div class="lm-canvas" id="liveMap"></div>
      <div class="lm-paused">Localização em pausa</div>
      <div class="lm-hud" aria-hidden="true">
        <div class="lm-top">
          <div class="lm-id">
            <span class="live">Live</span>
            <span class="lm-sub">Sprinter · Rota 45</span>
          </div>
          <div class="lm-clock" id="clock">--:--:--<small>LIS</small></div>
        </div>
        <div class="lm-coord" id="lmCoord"></div>
      </div>
      <div class="lm-ctrl">
        <button type="button" id="lmIn" aria-label="Aproximar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" id="lmOut" aria-label="Afastar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button type="button" id="lmHome" aria-label="Centrar na carrinha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      </div>
    </aside>
  </section>

  <section class="block" id="volBlock" hidden>
    <div class="kicker"><span class="slash"></span><span class="label">Os seus volumes</span></div>
    <ul class="vols" id="vols"></ul>
    <p class="tot" id="tot"></p>
  </section>

  <section class="contact">
    <p>Alguma dúvida? Ligue-nos<b>+351 967 951 060</b></p>
    <a class="btn" href="https://wa.me/351967951060" target="_blank" rel="noopener">WhatsApp</a>
  </section>
</main>
<p class="foot">Rota 45 Transportes, Unipessoal Lda.</p>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as T from './assets/js/trips.js';
import { mountLiveMap, drawRoute } from './assets/js/live-map.js';
import { tripEta, route, estimate, formatArrival, formatDuration, formatKm } from './assets/js/route.js';
import { currentPosition, publicPosition, subscribeLive } from './assets/js/live.js';
import { loadSprinter, CREDIT } from './assets/js/sprinter-model.js';

/* a change made in the management page (on this device) shows up here */
subscribeLive(function(){ location.reload(); });

var id = location.hash.slice(1);
var mapReady = null; /* Promise of the map, once mounted */
var eta = {id:null, data:null, failed:false};

function etaHtml(){
  if (eta.failed) return '<div class="eta-off"><span class="label">Chegada prevista</span><p>Previsão indisponível de momento.</p></div>';
  if (!eta.data) return '<div class="eta-off"><span class="label">Chegada prevista</span><p>A calcular…</p></div>';
  var e = estimate(eta.data.route);
  return '<div class="eta">'
    + '<div class="eta-main"><span class="label">Chegada prevista</span><b>' + formatArrival(e.arrive) + '</b></div>'
    + '<div><span class="label">Faltam</span><b>' + formatKm(eta.data.route.distance) + '</b></div>'
    + '<div><span class="label">Tempo</span><b>' + formatDuration(e.total) + '</b></div>'
    + '</div><p class="eta-note">Estimativa com pausas de 45 min a cada 4 h 30 de condução. Pode mudar com o trânsito.</p>';
}

/* route + estimate for the trip on the road; drawn on the map when both are ready */
function loadEta(t){
  if (eta.id === t.id) return;
  eta = {id:t.id, data:null, failed:false};
  /* the estimate uses the real position; the map only ever gets the public one */
  tripEta(t, currentPosition()).then(function(d){
    if (eta.id !== t.id) return;
    if (d) eta.data = d; else eta.failed = true;
    var box = document.getElementById('etaBox');
    if (box) box.innerHTML = etaHtml();
    var pub = publicPosition();
    if (!d || !pub || !mapReady) return;
    route(pub, d.dest).then(function(r){
      if (r) mapReady.then(function(map){ if (map) drawRoute(map, r.line, d.dest); });
    });
  });
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmt(n, d){ return Number(n).toLocaleString('pt-PT', {minimumFractionDigits:d || 0, maximumFractionDigits:d || 0}); }
function fmtDim(n){ return Number(n).toLocaleString('pt-PT', {maximumFractionDigits:1}); }
function hhmm(ts){ return new Date(ts).toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'}); }
function day(ts){ return new Date(ts).toLocaleDateString('pt-PT', {day:'2-digit', month:'2-digit'}); }

function render(){
  var trips = T.getTrips();
  var t = trips.find(function(x){ return x.id === id; });
  var head = document.getElementById('head');

  if (!t){
    head.innerHTML = '<div class="missing"><h1>Viagem não encontrada</h1>'
      + '<p>Confirme o link que recebeu ou ligue-nos para o +351 967 951 060.</p></div>';
    document.getElementById('mapBlock').hidden = true;
    document.getElementById('volBlock').hidden = true;
    return;
  }

  var first = t.client.split(' ')[0];
  var step = t.status === 'agendada' ? 0 : t.status === 'em_curso' ? 1 : 2;
  var names = ['Agendada', 'Em viagem', 'Entregue'];
  var steps = names.map(function(n, i){
    var cls = i < step ? ' done' : i === step ? ' now' + (i === 1 ? ' moving' : '') : '';
    return '<div class="step' + cls + '"><span>' + n + '</span></div>';
  }).join('');

  var status;
  if (t.status === 'agendada'){
    var n = T.ahead(trips, t);
    status = n === 0 ? 'A sua entrega é a <b>próxima</b>.'
      : 'Há <b>' + n + (n === 1 ? ' entrega' : ' entregas') + '</b> antes da sua.';
  } else if (t.status === 'em_curso'){
    status = 'A carrinha está a caminho desde as <b>' + hhmm(t.startedAt) + '</b>.';
  } else {
    status = 'Entregue a <b>' + day(t.finishedAt) + '</b> às <b>' + hhmm(t.finishedAt) + '</b>. Obrigado pela confiança.';
  }

  head.innerHTML = '<div class="kicker"><span class="slash"></span><span class="label">A sua entrega · Rota 45</span>'
    + (t.example ? '<span class="demo">Exemplo</span>' : '') + '</div>'
    + '<h1>Olá, ' + esc(first) + '.</h1>'
    + (t.from || t.to ? '<p class="route">' + esc(t.from || '?') + '<i>→</i>' + esc(t.to || '?') + '</p>' : '')
    + '<div class="steps" role="list" aria-label="Estado: ' + names[step] + '">' + steps + '</div>'
    + '<p class="status" aria-live="polite">' + status + '</p>'
    + (t.status === 'em_curso' && t.to ? '<div id="etaBox">' + etaHtml() + '</div>' : '');

  /* the map only matters until the parcels arrive */
  var showMap = t.status !== 'concluida';
  document.getElementById('mapBlock').hidden = !showMap;
  if (showMap && !mapReady){
    mapReady = mountLiveMap({
      el: document.getElementById('liveMap'),
      card: document.querySelector('.live-map'),
      van: publicPosition(),
      model: publicPosition() ? loadSprinter('assets/models/sprinter.glb') : null,
      credit: CREDIT,
      coordEl: document.getElementById('lmCoord'),
      zoomIn: document.getElementById('lmIn'),
      zoomOut: document.getElementById('lmOut'),
      home: document.getElementById('lmHome')
    });
  }
  if (t.status === 'em_curso' && t.to) loadEta(t);

  var tot = T.totals(t);
  document.getElementById('volBlock').hidden = !tot.n;
  document.getElementById('vols').innerHTML = t.packages.map(function(p){
    return '<li><b>' + p.qty + ' × ' + esc(p.desc || 'Volume') + (p.fragile ? ' (frágil)' : '') + '</b>'
      + '<span>' + fmtDim(p.l) + ' × ' + fmtDim(p.w) + ' × ' + fmtDim(p.h) + ' cm</span></li>';
  }).join('');
  document.getElementById('tot').textContent = tot.n + (tot.n === 1 ? ' volume' : ' volumes') + ' · '
    + fmt(tot.m3, 2) + ' m³ · ' + fmt(tot.kg) + ' kg';
}

function tickClock(){
  var el = document.getElementById('clock'), t;
  try { t = new Date().toLocaleTimeString('pt-PT', {hour12:false, timeZone:'Europe/Lisbon'}); }
  catch (e){ t = new Date().toTimeString().slice(0, 8); }
  el.innerHTML = t + '<small>LIS</small>';
}

window.addEventListener('hashchange', function(){ id = location.hash.slice(1); render(); });
T.subscribe(render);
render();
tickClock();
setInterval(tickClock, 1000);
setInterval(render, 30000); /* picks up changes made on another tab */
setInterval(function(){ /* the arrival time moves with the clock */
  var box = document.getElementById('etaBox');
  if (box && eta.data) box.innerHTML = etaHtml();
}, 60000);
</script>
</body>
</html>
